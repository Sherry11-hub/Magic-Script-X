[pytest]
# ── Test discovery ────────────────────────────────────────────────────────────
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# ── Output ────────────────────────────────────────────────────────────────────
# -v  = verbose (show each test name)
# -p no:warnings = suppress noisy 3rd-party deprecation warnings during tests
addopts          = -v -p no:warnings --tb=short

# ── Logging ───────────────────────────────────────────────────────────────────
log_cli          = true
log_cli_level    = WARNING
log_format       = %(asctime)s %(levelname)-8s %(name)s — %(message)s
log_date_format  = %H:%M:%S

# ── Markers (registered in conftest.py) ──────────────────────────────────────
# integration: requires live API keys — skipped by default
# slow:        requires model download or large doc processing
